   <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Health Companion</title>

  <style>
    /* ============================
       FULL SCREEN LOADING OVERLAY
       ============================ */
    #loadingOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .loader-box {
      text-align: center;
      color: white;
    }

    .loader-img {
      width: 70px;
      height: 70px;
    }

    .loader-text {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 600;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #d7f3e3, #a8e6cf);
      color: #2e4e3f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h2 {
      color: #217867;
      text-align: center;
      margin-bottom: 20px;
    }

    form {
      background-color: #ffffff;
      padding: 25px 40px;
      border-radius: 15px;
      width: 320px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #bcd4c2;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      transition: border-color 0.2s ease;
    }

    input:focus, textarea:focus {
      border-color: #5eb88b;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #2e8b57;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #1e6f45;
    }

    #result {
      margin-top: 20px;
      text-align: center;
      font-weight: 600;
      color: #155e3f;
    }
  </style>
</head>

<body>

  <!-- ============================
       FULL SCREEN LOADING OVERLAY
       ============================ -->
  <div id="loadingOverlay">
    <div class="loader-box">
      <img src="https://i.gifer.com/VAyR.gif" class="loader-img" />
      <p class="loader-text">Processing...</p>
    </div>
  </div>

  <h2>Enter Patient Details</h2>

  <form id="patientForm">
    <label>Name:</label>
    <input type="text" id="name" required>

    <label>Age:</label>
    <input type="number" id="age" required>

    <label>Symptoms:</label>
    <textarea id="symptoms" required></textarea>

    <label>Email ID:</label>
    <input type="email" id="email" required>

    <button type="submit">Submit</button>
  </form>

  <p id="result"></p>

  <script>
    document.getElementById('patientForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const overlay = document.getElementById("loadingOverlay");
      overlay.style.display = "flex"; // SHOW LOADING SCREEN

      const data = {
        name: document.getElementById('name').value,
        age: document.getElementById('age').value,
        symptoms: document.getElementById('symptoms').value,
        email: document.getElementById('email').value
      };

      try {
        const res = await fetch('https://healthcompanion-backend.onrender.com/api/patient', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const msg = await res.text();
        document.getElementById('result').innerText = msg;

      } catch (err) {
        document.getElementById('result').innerText = "Failed to connect to server.";
      }

      overlay.style.display = "none"; // HIDE LOADING SCREEN
    });
  </script>

</body>
</html>
